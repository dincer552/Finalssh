name: Build and Release FinalSSH

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set application version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          python -c "from pathlib import Path; import re,sys; p=Path('main.py'); s=p.read_text(encoding='utf-8'); s=re.sub(r'VERSION = \".*?\"', 'VERSION = \"'+sys.argv[1]+'\"', s, count=1); p.write_text(s, encoding='utf-8')" $version
      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FinalSSH main.py
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/FinalSSH.exe
