name: Build and Publish FinalSSH

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate version
        id: version
        shell: pwsh
        run: |
          $version = "0.2.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          $path = "main.py"
          $source = Get-Content $path -Raw
          $source = [regex]::Replace($source, 'VERSION = ".*?"', ('VERSION = "' + $version + '"'), 1)
          Set-Content -Path $path -Value $source -Encoding utf8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FinalSSH main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FinalSSH v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: dist/FinalSSH.exe
