name: Build and Publish FinalSSH

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: finalssh-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate version
        id: version
        shell: pwsh
        run: |
          $version = "0.2.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          Set-Content -Path build_info.py -Value @(
            '"""Build metadata embedded in FinalSSH."""'
            ('BUILD_VERSION = "' + $version + '"')
            ('BUILD_SHA = "' + $env:GITHUB_SHA + '"')
          ) -Encoding UTF8
          python -c "import build_info; assert build_info.BUILD_VERSION == '$version'; print(build_info.BUILD_VERSION, build_info.BUILD_SHA)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py updater.py build_info.py

      - name: Download and verify QudsLab Cloudflared DLL
        shell: pwsh
        run: |
          $dllUrl = "https://raw.githubusercontent.com/QudsLab/Cloudflared/ef1b0c079a3110234a17f7764eb83d5c9162350f/binaries/windows-amd64/cloudflared-windows-amd64.dll"
          $expectedHash = "d4f87009251fc952606dba6d8ad54f4a003ec290f93f37593c38badd1a60e745"
          Invoke-WebRequest -Uri $dllUrl -OutFile "cloudflared-windows-amd64.dll"
          $actualHash = (Get-FileHash "cloudflared-windows-amd64.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "QudsLab Cloudflared DLL SHA256 verification failed. Expected $expectedHash, got $actualHash"
          }
          Write-Host "Verified QudsLab Cloudflared DLL SHA256: $actualHash"

      - name: Smoke test QudsLab DLL exports
        shell: pwsh
        run: |
          python -c "import ctypes,pathlib; p=pathlib.Path('cloudflared-windows-amd64.dll').resolve(); lib=ctypes.CDLL(str(p)); lib.CloudflaredInit.argtypes=[]; lib.CloudflaredInit.restype=ctypes.c_int; lib.CloudflaredStop.argtypes=[]; lib.CloudflaredStop.restype=ctypes.c_int; lib.CloudflaredVersion.restype=ctypes.c_char_p; v=lib.CloudflaredVersion(); assert v; i=lib.CloudflaredInit(); assert i == 0, i; r=lib.CloudflaredStop(); assert r == 0, r; print('QudsLab DLL loaded; version:', v.decode('utf-8','replace'))"


      - name: Build single-file Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FinalSSH --add-binary "cloudflared-windows-amd64.dll;." main.py

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FinalSSH.exe" -DestinationPath "dist/FinalSSH.zip" -Force

      - name: Split latest EXE into 2 MiB update parts
        shell: pwsh
        run: |
          $chunkSize = 2MB
          $buffer = New-Object byte[] $chunkSize
          $inputStream = [System.IO.File]::OpenRead("dist/FinalSSH.exe")
          $index = 0
          try {
            while (($read = $inputStream.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $partName = "dist/FinalSSH_latest.part{0:D3}" -f $index
              $outputStream = [System.IO.File]::Create($partName)
              try {
                $outputStream.Write($buffer, 0, $read)
              } finally {
                $outputStream.Dispose()
              }
              Write-Host "Created $partName ($read bytes)"
              $index++
            }
          } finally {
            $inputStream.Dispose()
          }
          if ($index -eq 0) { throw "No update parts were generated." }
          Write-Host "Created $index update parts."

      - name: Upload ZIP to GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinalSSH-${{ steps.version.outputs.version }}
          path: dist/FinalSSH.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FinalSSH v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            dist/FinalSSH.exe
            dist/FinalSSH.zip
            dist/FinalSSH_latest.part*
