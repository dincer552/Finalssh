name: Build and Publish FinalSSH

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: finalssh-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate version
        id: version
        shell: pwsh
        run: |
          $version = "0.2.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          $path = "main.py"
          $source = Get-Content $path -Raw
          $source = [regex]::Replace($source, 'VERSION = ".*?"', ('VERSION = "' + $version + '"'), 1)
          Set-Content -Path $path -Value $source -Encoding utf8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Download and verify official Cloudflare client
        shell: pwsh
        run: |
          $headers = @{
            "User-Agent" = "FinalSSH-Build"
            "Accept" = "application/vnd.github+json"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/cloudflare/cloudflared/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq "cloudflared-windows-amd64.exe" } | Select-Object -First 1
          if (-not $asset) {
            throw "Official cloudflared Windows AMD64 release asset was not found."
          }
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
            throw "GitHub did not provide a SHA256 digest for the official cloudflared binary."
          }
          $expectedHash = $Matches[1].ToLowerInvariant()
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "cloudflared.exe"
          $actualHash = (Get-FileHash "cloudflared.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "cloudflared SHA256 verification failed. Expected $expectedHash, got $actualHash"
          }
          Write-Host "Verified official cloudflared $($release.tag_name), SHA256: $actualHash"

      - name: Build single-file Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FinalSSH --add-binary "cloudflared.exe;." main.py

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FinalSSH.exe" -DestinationPath "dist/FinalSSH.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FinalSSH v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            dist/FinalSSH.exe
            dist/FinalSSH.zip
